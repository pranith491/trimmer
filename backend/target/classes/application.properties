spring.application.name=bicky-nani-trimmer-booking
server.port=${PORT:8080}

# Configure these as environment variables in Render. Do not commit DB passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trimmer_booking?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.error.include-message=always

app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:5500}
